# Explicit opt-in; run with a rootless Docker context, without compose.flight.yaml.
# Compose >= 2.24.4 for !override. No socket is exposed to daidalis or its task containers.
services:
  daidalis:
    cpus: ${DAIDALIS_TASK_CPUS:-2}
    environment:
      DAIDALIS_EXECUTION_MODE: broker
      DAIDALIS_NATIVE_AGENTS: enabled
      DAIDALIS_BROKER_NATIVE_SOCKET: /broker-control/native.sock
      DAIDALIS_MODEL_SOCKET: /model-control/model.sock
      DAIDALIS_BROKER_FLIGHT: ${DAIDALIS_BROKER_FLIGHT:-0}
      DAIDALIS_BROKER_SOCKET: /broker-control/broker.sock
      DAIDALIS_DESKTOP_SOCKET: ""
    volumes:
      - broker-control:/broker-control:ro
      - model-control:/model-control
    depends_on:
      broker:
        condition: service_healthy
  desktop:
    profiles: !override [shared-desktop-only]
  broker:
    image: daidalis-broker:${DAIDALIS_TAG:-local}
    build:
      context: .
      target: broker
      entitlements: [network.host]
    user: "1000:1000"
    # Socket group as seen INSIDE the rootless user namespace. The installer
    # detects this without chmod/chown of the socket or adding host groups.
    group_add: ["${DAIDALIS_ROOTLESS_SOCKET_GID:-0}"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Long-lived browser/MCP/native relays each keep a bounded Docker CLI process.
    pids_limit: 512
    cpus: ${DAIDALIS_TASK_CPUS:-2}
    mem_limit: 2g
    memswap_limit: 2g
    restart: "no"
    environment:
      DAIDALIS_TASK_DOCKER_HOST: unix:///run/task-docker.sock
      DAIDALIS_TASK_IMAGE: daidalis-app:${DAIDALIS_TAG:-local}
      DAIDALIS_TASK_PROJECTS_VOLUME: ${DAIDALIS_TASK_PROJECTS_VOLUME:-${COMPOSE_PROJECT_NAME:-daidalis}_projects}
      DAIDALIS_BROKER_ID: ${DAIDALIS_BROKER_ID:-${COMPOSE_PROJECT_NAME:-daidalis}}
      DAIDALIS_TASK_CPUS: ${DAIDALIS_TASK_CPUS:-2}
      DAIDALIS_MODEL_VOLUME: ${DAIDALIS_MODEL_VOLUME:-${COMPOSE_PROJECT_NAME:-daidalis}_model-control}
      DAIDALIS_TASK_FLIGHT_IMAGE: ${DAIDALIS_TASK_FLIGHT_IMAGE:-}
    volumes:
      - type: bind
        source: ${DAIDALIS_ROOTLESS_SOCKET:?Set DAIDALIS_ROOTLESS_SOCKET to your rootless daemon socket}
        target: /run/task-docker.sock
        read_only: true
      - broker-control:/broker-control
    tmpfs: ["/tmp:rw,nosuid,nodev,size=512m,mode=1777"]
    healthcheck:
      test: [CMD, python3, -c, "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/broker-control/broker.sock'); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
volumes:
  model-control:
  broker-control:
